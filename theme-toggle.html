<button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode" style="position:fixed;top:.7rem;right:.7rem;left:auto;bottom:auto;width:2.05rem;height:2.05rem;z-index:1400;">
  <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
      <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
    </svg>
  </span>
  <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
      <path d="M12 17a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0-12a1 1 0 0 1 1 1v1.1a1 1 0 1 1-2 0V6a1 1 0 0 1 1-1Zm0 14.9a1 1 0 0 1 1 1V22a1 1 0 1 1-2 0v-.1a1 1 0 0 1 1-1ZM4.1 11a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2Zm18 0a1 1 0 1 1 0 2H21a1 1 0 1 1 0-2ZM5.8 5.8a1 1 0 1 1 1.4 1.4l-.8.8a1 1 0 1 1-1.4-1.4Zm11.8 11.8a1 1 0 1 1 1.4 1.4l-.8.8a1 1 0 1 1-1.4-1.4ZM18.2 5.8a1 1 0 0 1 1.4 0 1 1 0 0 1 0 1.4l-.8.8a1 1 0 1 1-1.4-1.4Zm-11.8 11.8a1 1 0 0 1 1.4 0 1 1 0 0 1 0 1.4l-.8.8a1 1 0 0 1-1.4-1.4Z"/>
    </svg>
  </span>
</button>
<script>
(() => {
  const toggle = document.querySelector('.theme-toggle');

  const hideQuartoToggles = () => {
    document.querySelectorAll('.quarto-color-scheme-toggle').forEach((el) => {
      el.style.setProperty('display', 'none', 'important');
      el.style.setProperty('visibility', 'hidden', 'important');
      el.style.setProperty('pointer-events', 'none', 'important');
    });
  };

  const syncPressedState = () => {
    if (!toggle) return;
    const isDark = document.body.classList.contains('quarto-dark');
    toggle.setAttribute('aria-pressed', isDark ? 'true' : 'false');
  };

  syncPressedState();
  window.addEventListener('DOMContentLoaded', hideQuartoToggles);
  setTimeout(hideQuartoToggles, 60);

  if (toggle) {
    toggle.addEventListener('click', () => {
      if (typeof window.quartoToggleColorScheme === 'function') {
        window.quartoToggleColorScheme();
      }

      requestAnimationFrame(syncPressedState);
      setTimeout(syncPressedState, 40);
      setTimeout(hideQuartoToggles, 40);
    });
  }
})();
</script>
